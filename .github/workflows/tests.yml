name: Tests

# MPI-443 made `npm test` + `npm run test:desktop` a release gate, but the gate was a
# human step in mpi-version-bump. This runs both on every push that carries code (see the
# paths-ignore note below) so a red suite is seen before a release, not during one.
#
# windows-latest runs BOTH: Electron needs no xvfb on Windows, and Playwright drives it
# through the `electron` npm binary, so there is no `npx playwright install` step.
#
# @cubric/connector is a `file:../Cubric-Studio/packages/connector` dependency and that
# sibling does not exist on a lone checkout. npm ci still exits 0 — it creates a dangling
# symlink rather than failing — and all three consumers (server.js, services/brokerBoot.js,
# services/connectorResponder.js) dynamic-import it inside try/catch and stay standalone
# when it is absent. So no PAT, no registry and no vendored copy are needed here.
# (The dangling symlink itself is a shipped-artifact problem, tracked on MPI-416.)

# MPI-878 — the paths-ignore below. Measured over 48h on master (198 completed runs):
# 128 of them, 65% of runs and 36.8 of 56 CI-hours, were docs/.agents/.md-only commits
# running this whole thing for no signal. `.husky/pre-push` already skips its master gate
# for exactly that set (its `DOCS_RE`), so the two now agree — keep them in step if either
# changes. 8 of the 21 reds in that window also sat on docs-only commits: they could not
# have caused anything, they inherited the red, spent 17 minutes proving it, and then
# became "master's last completed run" — which is the query BOTH `.husky/pre-push` and
# `red-master-watch.yml` gate on. A skipped push creates no run at all, so that query now
# returns the last real CODE verdict.

on:
  push:
    # Release branches are cut per version and named bare (1.3.0, 1.3.1) — a hotfix
    # landing there never touches master, so master alone would leave it untested
    # while the v* tag build still runs off it.
    branches: [master, '[0-9]*.[0-9]*.[0-9]*']
    # Skips only when EVERY changed file matches, so a push mixing code and docs still
    # runs. ORDER MATTERS — GitHub takes the LAST matching pattern, so the negation has
    # to follow both `**/*.md` and `docs/**` or it is overridden and silently does nothing.
    # (Repeated verbatim under pull_request below — GitHub Actions does not support
    # YAML anchors, so the two lists have to be kept in sync by hand.)
    paths-ignore:
      - '.agents/**'
      - '**/*.md'
      - 'docs/**'
      # NOT ignorable: these .md files are test INPUT, not prose.
      # `tests/agent-corpus.test.cjs:74` asserts at least one `docs/agent/*.md` ships, and
      # :139 requires a `docs/agent/models/<recipeModelId>.md` for every recipe. Nothing
      # else under docs/ or .agents/ is read by a test at runtime (the `docs` in
      # documents-heal.test.cjs is the user's Documents folder, not this directory).
      - '!docs/agent/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.agents/**'
      - '**/*.md'
      - 'docs/**'
      - '!docs/agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR run is superseded by its own next push, so cancelling it is right — group
  # those by ref. A push to master or a release branch is a permanent point in
  # history and has to get its own verdict, so give it a group of ONE (the run id):
  # it can neither cancel a running sibling nor be cancelled while queued behind one.
  #
  # Both failure modes were measured. `cancel-in-progress: true` grouped by ref meant
  # 17 of 60 master runs over two days ended cancelled with no verdict, and the commit
  # that broke the suite was rarely the one that went red — MPI-675 broke it in
  # e152cc10 (run 33489156063, cancelled a minute later) and 79faec57, a handoff
  # pointer adding one 4-line JSON file, wore the failure. Keeping the ref group and
  # setting cancel-in-progress FALSE only moves the problem: the run waits as pending
  # and the next push cancels it there instead. (MPI-676)
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lint and the unit suite are ~80 seconds together, against the desktop suite's ~16
  # minutes. Keeping them as their own job preserves what MPI-833 bought — a typo is red
  # in seconds, not at the end of a long run — and `needs:` below means a lint failure
  # never spends four runners.
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Until MPI-833 this ran nowhere on the runner, so `no-undef` (MPI-832) only
      # fired for whoever typed `npm run lint` by hand — and MPI-822 reached the
      # user's app as `ReferenceError: isRunning is not defined` past a green CI.
      # It lints the whole repo, not just js/: `routes/` is where a typo costs a
      # 500. Seconds, and it fails before the 20-minute suites.
      - run: npm run lint

      - run: npm test

  # MPI-878. 63 specs at `workers: 1` took 16.1 minutes of the run's 17.4 (measured on
  # run 35595318785, 11:42:28 -> 11:58:32), and that wall-clock is what an agent waits on
  # before it can close a card. Split across four runners instead.
  #
  # The parallelism is ACROSS runners, never inside one: `playwright.desktop.config.js`
  # keeps `workers: 1` / `fullyParallel: false`, because the specs share one CUBRIC_PORT
  # per process and launch an Electron app each. Every shard is its own process on its own
  # machine, so each runs `globalSetup` and takes its own free port — they cannot collide.
  desktop:
    needs: unit
    runs-on: windows-latest
    strategy:
      # A red master hides the next break (docs/red-master.md). Cancelling the other three
      # shards the moment one fails would rebuild that exact blind spot inside a single run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run test:desktop -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per-shard, or the four uploads collide and only one survives.
          name: playwright-results-${{ matrix.shard }}
          # Each failing spec leaves its whole Electron profile behind under
          # user-data/ — 301 MB of Chromium cache in the first red run, for zero
          # diagnostic value. The traces, screenshots and error-context are the
          # part worth downloading.
          path: |
            test-results/
            !test-results/**/user-data/**
          if-no-files-found: ignore
          retention-days: 7
